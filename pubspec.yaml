name: rugged
description: "A high intensity workout tracking Flutter application."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  connectivity_plus: ^7.1.1
  sqflite_live: ^1.0.0
  flutter_screenutil: ^5.9.0
  provider: ^6.1.1
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.0.1
  go_router: ^17.2.3
  image_picker: ^1.2.2
  intl: ^0.20.2
  fl_chart: ^1.2.0
  flutter_slidable: ^4.0.3
  uuid: ^4.5.3
  sqflite: ^2.4.0
  path: ^1.9.0
  file_picker: ^8.1.7
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1
  alarm: ^5.5.0
  android_intent_plus: ^5.0.0
  share_plus: ^10.1.4
  app_links: ^6.3.2
  shared_preferences: ^2.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  http: ^1.2.2
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  google_mobile_ads: ^5.2.0
  in_app_purchase: ^3.2.0
  collection: ^1.19.0
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/images/rugged_app_icon.png"
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "lib/assets/images/rugged_app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/rugged_app_icon.png
    - lib/assets/images/affulabs_presents_logo_nobackground.png
  fonts:
    - family: Impact
      fonts:
        - asset: lib/assets/fonts/Impact.ttf